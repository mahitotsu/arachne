spring:
  application:
    name: arachne-session-redis
  main:
    web-application-type: none
  data:
    redis:
      host: localhost
      port: 6379
  session:
    redis:
      namespace: arachne:session-redis:sample

arachne:
  strands:
    model:
      provider: bedrock
      id: jp.amazon.nova-2-lite-v1:0
      region: ap-northeast-1
    agent:
      system-prompt: "Remember the latest destination across application restarts."
      conversation:
        window-size: 8
      session:
        id: session-redis-demo