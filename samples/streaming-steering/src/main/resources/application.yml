spring:
  application:
    name: arachne-streaming-steering
  main:
    banner-mode: off
    web-application-type: none

arachne:
  strands:
    model:
      provider: bedrock
      id: jp.amazon.nova-2-lite-v1:0
      region: ap-northeast-1
    agent:
      system-prompt: "You are a support assistant. Prefer safe cached guidance over risky live lookups."